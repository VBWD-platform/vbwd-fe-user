# S47.2 cache-bypass (parity with nginx.prod.conf.template). DEV serves the
# static `${VAR_DIR}/seo/<slug>.html` prerender ONLY to crawlers/curl (matched by
# User-Agent) so SEO output is verifiable locally; real BROWSERS always get the
# live Vite CSR SPA (full layout + styles + HMR). Why UA-gate in dev: the
# prerendered asset hashes aren't served by Vite, so a browser can't hydrate the
# static file — humans must get the SPA. Prod gates on the session cookie instead
# (its built dist hydrates fine). Prerender dir is mounted read-only at
# /usr/share/nginx/seo (see compose). Runbook: plugins/cms/docs/seo/nginx-prerender.md.
map $http_cookie $vbwd_is_authed {
    default 0;
    "~*vbwd_session=" 1;
}
# S150 — the crawler UA list is the shared snippet (one source for dev + prod),
# bind-mounted at /etc/nginx/snippets/ (see docker-compose.yaml).
map $http_user_agent $vbwd_is_crawler {
    include /etc/nginx/snippets/crawler-user-agents.conf;
}
# S152-11a — frontend-router maps ($vbwd_page_location, $forwarded_proto); shared
# snippet, bind-mounted at /etc/nginx/snippets/ (see docker-compose.yaml).
include /etc/nginx/snippets/frontend-router-map.conf;

# S120.1 — nginx-layer geo-block (DEV). The njs handler owns `location /` and
# either passes to the SPA/@vite chain (`@spa`) or blocks / grants a bypass.
# There is no GeoIP DB in dev: `$geoip2_country_code` is defined empty by the
# bind-mounted 00-vbwd-geoip2.conf (fallback map), and the country comes from the
# `X-VBWD-Geo-Test` header (GEO_TEST_ALLOW=1). The njs module + `env` are injected
# into the main nginx.conf by the bind-mounted docker-entrypoint.d scripts (the
# stock image ships the njs .so but does not load it). See geo_block.js.
js_path "/etc/nginx/njs/";
js_import geo from geo_block.js;

server {
    listen 80;
    resolver 127.0.0.11 valid=5s;

    # Allow large image uploads (raw photo / base64-inflated e2e ciphertext).
    # Must exceed meinchat `attachment_max_bytes` (25 MB) + ~33% base64 overhead.
    client_max_body_size 40m;

    set $vite http://dev:5173;
    set $backend http://host.docker.internal:5000;
    set $pluginapi http://plugin-api:3001;

    # Proxy Plugin API requests
    location /_plugins {
        proxy_pass $pluginapi;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Proxy uploaded media files to backend
    location /uploads/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-VBWD-Render "";
    }

    # SEO — robots.txt, sitemaps and the IndexNow key file → backend (cms
    # plugin). Shared snippet, bind-mounted at /etc/nginx/snippets/ (S150).
    include /etc/nginx/snippets/seo-proxy-locations.conf;

    # S152-11a — the frontend router: @frontend (HTML navigations ask the backend
    # first, fall back to @spa) + /_render/* (theme fragments/assets). Shared
    # snippet, bind-mounted at /etc/nginx/snippets/. Every other backend proxy
    # here blanks X-VBWD-Render so a client can never mark a themed render.
    include /etc/nginx/snippets/frontend-router.conf;

    # SSE event stream — never buffer (browser would only see messages on
    # refresh). Exact-match ignores the ?stream_token=… query.
    location = /api/v1/messaging/stream {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-VBWD-Render "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-VBWD-Render "";
    }

    # Proxy Socket.IO to backend
    location /socket.io/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-VBWD-Render "";
    }

    # Vite HMR websocket
    location /__vite_hmr {
        proxy_pass $vite;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
    }

    # S120.1 — the njs geo-block handler decides pass / block / bypass, then
    # internalRedirects on pass to $vbwd_geo_pass_location (S152-11a): @frontend
    # for HTML navigations, @spa for everything else (Vite module requests never
    # reach the backend). Off / config missing ⇒ pass, exactly as before.
    location / {
        set $vbwd_geo_pass_location $vbwd_page_location;
        js_content geo.handle;
    }

    # S152-11a (D7) — SPA-only areas: same geo-block, but a pass ALWAYS lands in
    # @spa, never @frontend. Segment-aware: /dashboard, /dashboard/…, /tuktuk,
    # /tuktuk/… (not /dashboardx).
    location ~ ^/(dashboard|tuktuk)(/|$) {
        set $vbwd_geo_pass_location @spa;
        js_content geo.handle;
    }

    # Crawler/curl → prerendered SEO file if it exists, else Vite.
    # Humans (any browser) → always Vite (full CSR SPA + HMR).
    # Reached via the geo handler's pass, or @frontend's 404/5xx fallback.
    location @spa {
        root /usr/share/nginx;
        error_page 418 = @vite;
        if ($vbwd_is_crawler = 0) { return 418; }
        try_files /seo$uri.html /seo$uri/index.html @vite;
    }

    # Everything else (and the SPA fallback) → Vite dev server
    location @vite {
        proxy_pass $vite;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}