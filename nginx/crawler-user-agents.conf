# S150 — the ONE crawler user-agent list (map body). `include`d inside
# `map $http_user_agent $vbwd_is_crawler { ... }` by nginx.dev.conf and
# nginx.prod.conf.template; every other crawler variable derives from
# $vbwd_is_crawler. Covers classic search/social crawlers (`bot|crawl|spider…`),
# AI agents and fetchers whose names lack those substrings (ChatGPT-User,
# Claude-User, anthropic-ai, Perplexity-User, meta-externalagent/-fetcher,
# cohere-ai, GoogleOther, Google-InspectionTool, MistralAI-User, ia_archiver) and
# CLI tooling so SEO output is verifiable with curl. Never add a token that
# occurs in a mainstream browser UA — humans must keep the live SPA
# (guarded by vue/tests/unit/nginx-seo-routing.spec.ts).
default 0;
"~*(bot|crawl|spider|slurp|mediapartners|yandex|baiduspider|facebookexternalhit|embedly|pinterest|whatsapp|preview|chatgpt-user|claude-user|anthropic-ai|perplexity-user|meta-external|cohere-ai|googleother|google-inspectiontool|mistralai-user|ia_archiver|curl|wget|python-requests|httpie|headlesschrome)" 1;
