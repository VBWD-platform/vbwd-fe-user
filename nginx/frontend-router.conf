# S152-11a (D5, D7, W2) — the frontend router: server-level locations, expects
# `$backend` (backend origin, no path) and the maps in frontend-router-map.conf.
# `include`d by nginx.dev.conf and nginx.prod.conf.template; mirrored verbatim by
# vbwd-platform/fe-user/nginx.conf (drift-guarded by nginx-seo-routing.spec.ts).
#
# @frontend — an HTML navigation, reached from `location /` AFTER the geo-block.
# Proxied at the ORIGINAL request URI (W2: themed pages live at public paths, so
# the cms routing middleware sees the real path). nginx overwrites
# `X-VBWD-Render: 1` — the only marker a themed page answers to — and drops the
# bearer: a navigation never carries one, and the in-process API dispatch (C2)
# must not forward it. A 404 (vue mode / no theme route) or a down backend lands
# in the unchanged @spa chain; `recursive_error_pages` lets @spa's own error_page
# branches (crawler / Vite hand-offs) still fire after this hop.
location @frontend {
    proxy_pass $backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-VBWD-Render 1;
    proxy_set_header Authorization "";
    proxy_intercept_errors on;
    recursive_error_pages on;
    error_page 404 502 503 504 = @spa;
}

# Theme fragments (personalised regions) and assets. The bearer passes through —
# the regions fragment re-renders the page as that user. Never marked as a page
# render, and no SPA fallback: these answer JSON / CSS / static files.
location ^~ /_render/ {
    proxy_pass $backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-VBWD-Render "";
}
