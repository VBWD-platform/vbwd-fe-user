# S152-11a (D5) — http-level maps for the frontend router (frontend-router.conf).
# `include`d at http level by nginx.dev.conf and nginx.prod.conf.template;
# mirrored verbatim by vbwd-platform/fe-user/nginx.conf (drift-guarded by
# vue/tests/unit/nginx-seo-routing.spec.ts). One conf serves both frontend modes:
# the mode lives only in the backend .env.
#
# $vbwd_page_location — where a page request goes after the geo-block. An HTML
# navigation (GET/HEAD whose Accept names text/html) asks the backend first
# (@frontend); everything else — Vite module requests (Accept */*), XHR, POSTs —
# goes straight to the SPA chain (@spa) and never reaches the backend.
map "$request_method:$http_accept" $vbwd_page_location {
    default                    @spa;
    "~^(GET|HEAD):.*text/html" @frontend;
}

# TLS terminates at the OUTER (host) proxy, so `$scheme` here is "http". Relay
# the scheme the edge actually saw, so backend-built absolute URLs (redirect
# Locations, payment return URLs) keep `https://`. Falls back to `$scheme` when
# the header is absent (direct container access, local dev).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
