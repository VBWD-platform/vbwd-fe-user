# S150 — SEO files are DYNAMIC backend routes (cms plugin) served at the site
# root: robots.txt, the sitemap index + pages, and the IndexNow key file
# (/<key>.txt, 8-128 chars so /robots.txt never matches). `include`d at server
# level by nginx.dev.conf (expects `$backend`); mirrored verbatim by
# vbwd-platform/fe-user/nginx.conf (drift-guarded by nginx-seo-routing.spec.ts).
# `Host $http_host` keeps the port, so the backend's sitemap URL fallback is
# right on :8080 installs. `X-VBWD-Render` is blanked (S152-11a): only the
# frontend router's @frontend may mark a request as a themed page render.
location = /robots.txt {
    proxy_pass $backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-VBWD-Render "";
}
location = /sitemap.xml {
    proxy_pass $backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-VBWD-Render "";
}
location ~ ^/sitemap-\d+\.xml$ {
    proxy_pass $backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-VBWD-Render "";
}
location ~ "^/[A-Za-z0-9-]{8,128}\.txt$" {
    proxy_pass $backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-VBWD-Render "";
}
