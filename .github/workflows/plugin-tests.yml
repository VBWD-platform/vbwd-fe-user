name: Plugin Tests

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  unit:
    name: Unit — ${{ matrix.plugin }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [booking, chat, checkout, cms, ghrm, landing1, license, paypal-payment, stripe-payment, tarot, theme-switcher, yookassa-payment]

    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure private plugin auth
        env:
          PLUGIN_PAT: ${{ secrets.PLUGIN_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${PLUGIN_PAT:-}" ]; then
            git config --global \
              url."https://x-access-token:${PLUGIN_PAT}@github.com/".insteadOf \
              "https://github.com/"
          fi
      - name: Install ALL plugins
        run: |
          for entry in "chat:vbwd-fe-user-plugin-chat" "checkout:vbwd-fe-user-plugin-checkout" "cms:vbwd-fe-user-plugin-cms" "ghrm:vbwd-fe-user-plugin-ghrm" "landing1:vbwd-fe-user-plugin-landing1" "license:vbwd-fe-user-plugin-license" "paypal-payment:vbwd-fe-user-plugin-paypal-payment" "stripe-payment:vbwd-fe-user-plugin-stripe-payment" "tarot:vbwd-fe-user-plugin-tarot" "theme-switcher:vbwd-fe-user-plugin-theme-switcher" "yookassa-payment:vbwd-fe-user-plugin-yookassa-payment" "booking:vbwd-fe-user-plugin-booking"; do
            name="${entry%%:*}"; repo="${entry##*:}"
            git clone --depth=1 -q "https://github.com/VBWD-platform/${repo}.git" "plugins/$name" 2>/dev/null || echo "Skipping $name"
          done
      - name: Run style + unit
        run: ./bin/pre-commit-check.sh --plugin ${{ matrix.plugin }} --unit

  integration:
    name: Integration — ${{ matrix.plugin }}
    needs: unit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin: [booking, chat, checkout, cms, ghrm, tarot]

    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure private plugin auth
        env:
          PLUGIN_PAT: ${{ secrets.PLUGIN_PAT }}
        run: |
          set -euo pipefail
          if [ -n "${PLUGIN_PAT:-}" ]; then
            git config --global \
              url."https://x-access-token:${PLUGIN_PAT}@github.com/".insteadOf \
              "https://github.com/"
          fi
      - name: Install ALL plugins
        run: |
          for entry in "chat:vbwd-fe-user-plugin-chat" "checkout:vbwd-fe-user-plugin-checkout" "cms:vbwd-fe-user-plugin-cms" "ghrm:vbwd-fe-user-plugin-ghrm" "landing1:vbwd-fe-user-plugin-landing1" "license:vbwd-fe-user-plugin-license" "paypal-payment:vbwd-fe-user-plugin-paypal-payment" "stripe-payment:vbwd-fe-user-plugin-stripe-payment" "tarot:vbwd-fe-user-plugin-tarot" "theme-switcher:vbwd-fe-user-plugin-theme-switcher" "yookassa-payment:vbwd-fe-user-plugin-yookassa-payment" "booking:vbwd-fe-user-plugin-booking"; do
            name="${entry%%:*}"; repo="${entry##*:}"
            git clone --depth=1 -q "https://github.com/VBWD-platform/${repo}.git" "plugins/$name" 2>/dev/null || echo "Skipping $name"
          done
      - name: Run integration tests
        run: ./bin/pre-commit-check.sh --plugin ${{ matrix.plugin }} --integration
